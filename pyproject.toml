[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-workflow"
version = "1.2.0"
description = "Portable typed-decision client for OpenAI Decisions, TypeSafe System One and OpenRouter, with a stdio MCP server. Offline unless --live."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cathy-kim" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/cathy-kim/jev-workflow"

[project.scripts]
jev-workflow = "jev_workflow.cli:main"
jev-workflow-mcp = "jev_workflow.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "plugins/jev/skills/jev-decisions/scripts" }
packages = ["jev_workflow"]
include-package-data = false
