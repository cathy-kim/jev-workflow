name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core offline tests
        run: python3 -B -m unittest discover -s plugins/jev/skills/jev-decisions/scripts -p 'test_decision_kit.py' -v
      - name: Synthetic demo
        run: python3 -B examples/offline_demo.py
      - name: Package and site tests
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Rebuild static site and portable downloads
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- docs
